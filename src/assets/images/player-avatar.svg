<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="playerAvatarTitle">
  <title id="playerAvatarTitle">Player avatar (placeholder)</title>
  <defs>
    <clipPath id="avatarClip">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
  </defs>
  <g clip-path="url(#avatarClip)">
    <rect width="64" height="64" fill="#cfeaff" />
    <!-- hair back -->
    <path d="M10 30 C10 10 22 2 32 2 C42 2 54 10 54 30 L54 46 L44 46 L44 34 L20 34 L20 46 L10 46 Z" fill="#2b2140" />
    <!-- face -->
    <path d="M18 28 C18 14 24 9 32 9 C40 9 46 14 46 28 C46 40 40 47 32 47 C24 47 18 40 18 28 Z" fill="#ffddc2" />
    <!-- blush -->
    <ellipse cx="21.5" cy="33" rx="3.2" ry="2" fill="#ff9a9a" opacity="0.6" />
    <ellipse cx="42.5" cy="33" rx="3.2" ry="2" fill="#ff9a9a" opacity="0.6" />
    <!-- big anime eyes -->
    <g>
      <ellipse cx="24" cy="29" rx="4.6" ry="6" fill="#fff" />
      <ellipse cx="40" cy="29" rx="4.6" ry="6" fill="#fff" />
      <ellipse cx="24.8" cy="30" rx="3.2" ry="4.6" fill="#2e86ab" />
      <ellipse cx="40.8" cy="30" rx="3.2" ry="4.6" fill="#2e86ab" />
      <circle cx="24" cy="27.5" r="1" fill="#fff" />
      <circle cx="40" cy="27.5" r="1" fill="#fff" />
      <path d="M19 24 Q24 20 29 24" stroke="#2b2140" stroke-width="1.6" fill="none" stroke-linecap="round" />
      <path d="M35 24 Q40 20 45 24" stroke="#2b2140" stroke-width="1.6" fill="none" stroke-linecap="round" />
    </g>
    <!-- smile -->
    <path d="M27 38 Q32 42 37 38" stroke="#c1666b" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- hair front fringe -->
    <path d="M12 26 C14 12 22 4 32 4 C42 4 50 12 52 26 C46 18 40 15 32 15 C24 15 18 18 12 26 Z" fill="#3a2e6e" />
    <!-- collar / shoulders -->
    <path d="M8 58 C8 48 18 44 32 44 C46 44 56 48 56 58 L56 64 L8 64 Z" fill="#ffc94d" />
  </g>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#2b2140" stroke-width="2" />
