<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="territoryRunTitle">
  <title id="territoryRunTitle">Territory Run</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23201d" />
      <stop offset="55%" stop-color="#4a3527" />
      <stop offset="100%" stop-color="#e8590c" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="routeGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb15c" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffb15c" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffe0b3" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#skyGrad)" />
  <circle cx="1260" cy="200" r="480" fill="url(#glowA)" />
  <circle cx="180" cy="760" r="420" fill="url(#glowB)" />

  <!-- sparse pin-point texture, faint — hints at a map without reading as clutter -->
  <g fill="#ffffff" fill-opacity="0.14">
    <circle cx="120" cy="140" r="2.5" />
    <circle cx="240" cy="90" r="1.8" />
    <circle cx="90" cy="320" r="2" />
    <circle cx="1480" cy="620" r="2.5" />
    <circle cx="1400" cy="760" r="1.8" />
    <circle cx="1530" cy="500" r="2" />
    <circle cx="1360" cy="120" r="1.6" />
    <circle cx="60" cy="560" r="1.6" />
  </g>

  <!-- a single, quiet running route sketched across the frame -->
  <path
    d="M120 640 C 380 720, 560 480, 820 500 C 1080 520, 1140 260, 1420 220"
    fill="none"
    stroke="url(#routeGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="1 20"
  />

  <circle cx="120" cy="640" r="6" fill="#ffe0b3" fill-opacity="0.55" />

  <circle cx="1420" cy="220" r="22" fill="#ffb15c" fill-opacity="0.18">
    <animate attributeName="r" values="16;26;16" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.3;0.05;0.3" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1420" cy="220" r="7" fill="#ffe0b3" />
</svg>
