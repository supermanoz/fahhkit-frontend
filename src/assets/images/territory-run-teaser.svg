<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700" width="1920" height="700" role="img" aria-labelledby="territoryRunTitle">
  <title id="territoryRunTitle">Territory Run</title>
  <defs>
    <!-- Centered radially (not cornered) so the brightest tone survives
         background-size:cover's crop no matter how wide or narrow the
         carousel ends up being — cover always keeps the center pixel. -->
    <radialGradient id="vignette" cx="50%" cy="44%" r="85%">
      <stop offset="0%" stop-color="#4a3323" />
      <stop offset="45%" stop-color="#241a12" />
      <stop offset="100%" stop-color="#100b07" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#ffb15c" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#ffb15c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffb15c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4c430" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffe8c2" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#f4c430" fill-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="1920" height="700" fill="url(#vignette)" />
  <rect width="1920" height="700" fill="url(#dotGrid)" />
  <ellipse cx="960" cy="294" rx="560" ry="320" fill="url(#spotlight)" />

  <!-- a short, quiet running loop kept inside the safe center band that
       survives cover-crop at every viewport width, mobile through
       ultrawide -->
  <path
    d="M780 420 C 860 380, 900 340, 960 340 C 1020 340, 1080 300, 1140 300"
    fill="none"
    stroke="url(#routeGrad)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="1 20"
  />
  <circle cx="780" cy="420" r="6" fill="#ffe0b3" fill-opacity="0.6" />

  <circle cx="1140" cy="300" r="20" fill="#f4c430" fill-opacity="0.22">
    <animate attributeName="r" values="14;24;14" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.32;0.08;0.32" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1140" cy="300" r="6" fill="#ffe8c2" />
</svg>
