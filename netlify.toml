# Which backend a deploy talks to follows the deploy context (see
# scripts/check-backend-target.mjs, which also fails a mismatched build):
#   production context (the production branch, main) -> PRODUCTION API
#   everything else (RUN_CONQUER, other branch deploys, PR previews) -> TEST API
# Netlify > Site configuration > Build & deploy: production branch MUST be
# main, and no VITE_API_* env vars may be set there (they would override the
# .env.production / .env.staging files).
[build]
  command = "npm run build:test"
  publish = "dist"

[context.production]
  command = "npm run build:prod"

[context.branch-deploy]
  command = "npm run build:test"

[context.deploy-preview]
  command = "npm run build:test"

# React Router client-side routing — let the app handle all paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (web build). CSP notes: script-src is locked to our own
# bundle + Google/Apple sign-in; connect-src keeps https:/wss: as schemes
# only (API host differs per deploy, tiles/weather/routing hosts vary) but
# still blocks http/ws downgrade. 'unsafe-inline' is for styles only
# (Leaflet/framer-motion set inline styles); no inline scripts are allowed.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src https://accounts.google.com https://appleid.apple.com; object-src 'none'; base-uri 'self'; form-action 'self' https://appleid.apple.com; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
